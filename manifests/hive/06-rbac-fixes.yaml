# RBAC fixes pour installation Hive via Kustomize (sans OLM)
# Ces RBAC sont normalement inclus dans le bundle OLM
# mais manquants dans le kustomize upstream v1.1.16
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-operator-leader-election
  namespace: hive
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-operator-leader-election
  namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-operator-leader-election
subjects:
- kind: ServiceAccount
  name: hive-operator
  namespace: hive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hive-operator-openshift-config
rules:
- apiGroups:
  - config.openshift.io
  resources:
  - proxies
  - apiservers
  - infrastructures
  - clusterversions
  - dnses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hive-operator-openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hive-operator-openshift-config
subjects:
- kind: ServiceAccount
  name: hive-operator
  namespace: hive
